<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Mirko Rabboni | Consulente Aquamed</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{
  --cyan:#00d9ff;
  --pink:#ec008c;
  --line:rgba(148,163,184,.25);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:100vh;
  background:url("hero.png") center/cover no-repeat fixed;
  display:flex;
  justify-content:center;
  align-items:center;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.75);
}

.phone{
  width:100%;
  max-width:460px;
  min-height:100vh;
  background:rgba(2,8,23,.78);
  backdrop-filter:blur(12px);
  padding:16px;
  color:#fff;
  display:flex;
  flex-direction:column;
  gap:14px;
  z-index:1;
}

header{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,var(--cyan),var(--pink));
  display:flex;align-items:center;justify-content:center;
  font-weight:900;
}

.card{
  background:rgba(2,6,23,.62);
  border:1px solid var(--line);
  border-radius:22px;
  padding:14px;
}

.meta{
  font-size:13px;
  line-height:1.5;
}

.meta a{color:#9eefff;text-decoration:none;font-weight:700}

.hero{text-align:center;}

.video-box{
  background:linear-gradient(135deg,var(--cyan),var(--pink));
  padding:2px;border-radius:20px;
}

.video-box video{
  width:100%;
  border-radius:18px;
}

.video-controls button{
  flex:1;padding:10px;border:none;
  background:#111;color:#fff;font-size:12px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
}

.btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(2,6,23,.6);
  color:#fff;
  font-size:12px;
  text-decoration:none;
}

.dot{
  width:9px;height:9px;border-radius:50%;
  background:linear-gradient(135deg,var(--cyan),var(--pink));
}

.cta button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,var(--pink),var(--cyan));
  color:#fff;
  font-weight:900;
}

footer{
  margin-top:auto;
  text-align:center;
  font-size:10px;
  color:#94a3b8;
}

.ai-full{
  position:fixed;inset:0;background:black;
  display:none;z-index:9999;
}

.ai-full.active{display:block}

.ai-full iframe{width:100%;height:100%;border:none}

.close{
  position:absolute;top:12px;right:12px;
  background:black;color:white;padding:10px;
  border-radius:30px;border:1px solid white;
}
</style>
</head>

<body>

<div class="phone">

<header>
  <div class="logo">A</div>
  <div>
    <strong>Aquamed</strong><br>
    <small>emozione pura</small>
  </div>
</header>

<section class="card">
  <h2>RABBONI MIRKO</h2>
  <div class="meta">
    Consulente Aquamed<br><br>
    Email: <a href="mailto:rabboni.mirko@gmail.com">rabboni.mirko@gmail.com</a><br>
    Tel: <a href="tel:+393271514496">+39 3271514496</a>
  </div>

  <div class="actions" style="margin-top:12px;">
    <a class="btn" href="tel:+393271514496"><span class="dot"></span>Chiama</a>
    <a class="btn" href="mailto:rabboni.mirko@gmail.com"><span class="dot"></span>Email</a>
    <a class="btn" href="https://wa.me/393271514496" target="_blank"><span class="dot"></span>WhatsApp</a>
    <button class="btn" onclick="saveContact()"><span class="dot"></span>Salva contatto</button>
  </div>
</section>

<section class="video-box">
  <video id="introVideo" autoplay muted loop playsinline controls>
    <source src="aquamed-video.mp4" type="video/mp4">
  </video>
</section>

<section class="cta">
  <button onclick="openAI()">💬 Parla con il tuo consulente AI</button>
</section>

<!-- SOCIAL / LINK -->
<section class="actions">
  <a class="btn" href="https://www.aquamed.it" target="_blank">
    <span class="dot"></span>Sito Aquamed
  </a>

  <a class="btn" href="https://www.instagram.com/aquameditalia/" target="_blank">
    <span class="dot"></span>Instagram
  </a>

  <a class="btn" href="https://www.facebook.com/AquamedItalia" target="_blank">
    <span class="dot"></span>Facebook
  </a>

  <a class="btn" href="https://www.linkedin.com" target="_blank">
    <span class="dot"></span>LinkedIn
  </a>
</section>

<footer>© <span id="year"></span> Aquamed</footer>

</div>

<div id="aiBox" class="ai-full">
  <button class="close" onclick="closeAI()">Chiudi</button>
  <iframe src="paginaai.html"></iframe>
</div>

<script>
document.getElementById("year").textContent=new Date().getFullYear();

function openAI(){
  document.getElementById("aiBox").classList.add("active");
}

function closeAI(){
  document.getElementById("aiBox").classList.remove("active");
}

function saveContact(){
const v=`BEGIN:VCARD
VERSION:3.0
FN:RABBONI MIRKO
TEL:+393271514496
EMAIL:rabboni.mirko@gmail.com
END:VCARD`;

const blob=new Blob([v],{type:"text/vcard"});
const link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download="contatto.vcf";
link.click();
}
</script>

</body>
</html>
