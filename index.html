<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Mirko Rabboni | Aquamed</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{
  --cyan:#00d9ff;
  --pink:#ec008c;
  --line:rgba(148,163,184,.25);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:100vh;
  background:url("hero.png") center/cover no-repeat fixed;
  display:flex;
  justify-content:center;
  align-items:center;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.75);
}

.phone{
  width:100%;
  max-width:460px;
  min-height:100vh;
  background:rgba(2,8,23,.78);
  backdrop-filter:blur(12px);
  padding:16px;
  color:#fff;
  display:flex;
  flex-direction:column;
  gap:14px;
  z-index:1;
}

header{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,var(--cyan),var(--pink));
  display:flex;align-items:center;justify-content:center;
  font-weight:900;
}

.card{
  background:rgba(2,6,23,.62);
  border:1px solid var(--line);
  border-radius:22px;
  padding:14px;
}

.meta{
  font-size:13px;
  line-height:1.5;
}

.meta a{color:#9eefff;text-decoration:none;font-weight:700}

.video-box{
  background:linear-gradient(135deg,var(--cyan),var(--pink));
  padding:2px;border-radius:20px;
  position:relative;
}

.video-box video{
  width:100%;
  border-radius:18px;
  display:block;
  background:#000;
}

/* overlay play */
.play-overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  background:rgba(0,0,0,.4);
  border-radius:18px;
  cursor:pointer;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(2,6,23,.6);
  color:#fff;
  font-size:12px;
  text-decoration:none;
  cursor:pointer;
  margin-top:10px;
}

.cta button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,var(--pink),var(--cyan));
  color:#fff;
  font-weight:900;
  margin-top:10px;
}

.ai-full{
  position:fixed;inset:0;background:black;
  display:none;z-index:9999;
}

.ai-full.active{display:block}

.ai-full iframe{width:100%;height:100%;border:none}

.close{
  position:absolute;top:12px;right:12px;
  background:black;color:white;padding:10px;
  border-radius:30px;border:1px solid white;
}
</style>
</head>

<body>

<div class="phone">

<header>
  <div class="logo">A</div>
  <div>
    <strong>Aquamed</strong><br>
    <small>emozione pura</small>
  </div>
</header>

<section class="card">
  <h2>RABBONI MIRKO</h2>
  <div class="meta">
    Consulente Aquamed<br><br>
    Email: <a href="mailto:rabboni.mirko@gmail.com">rabboni.mirko@gmail.com</a><br>
    Tel: <a href="tel:+393271514496">+39 3271514496</a>
  </div>
</section>

<!-- VIDEO -->
<section class="video-box">
  <video id="video" playsinline muted>
    <source src="aquamed-video.mp4" type="video/mp4">
  </video>

  <div class="play-overlay" id="playBtn">▶</div>
</section>

<!-- CTA -->
<section class="cta">
  <button onclick="openAI()">💬 Parla con il tuo consulente AI</button>
</section>

</div>

<!-- AI FULLSCREEN -->
<div id="aiBox" class="ai-full">
  <button class="close" onclick="closeAI()">Chiudi</button>
  <iframe src="paginaai.html"></iframe>
</div>

<script>
const video = document.getElementById("video");
const playBtn = document.getElementById("playBtn");

/* TAP PER AVVIARE VIDEO */
playBtn.addEventListener("click", () => {
  video.muted = false;
  video.play();
  playBtn.style.display = "none";
});

/* APERTURA AI */
function openAI(){
  video.pause();
  video.muted = true;
  document.getElementById("aiBox").classList.add("active");
}

/* CHIUSURA AI */
function closeAI(){
  document.getElementById("aiBox").classList.remove("active");
}
</script>

</body>
</html>
